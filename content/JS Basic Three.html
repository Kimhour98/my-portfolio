
<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JS Basic Three</title>

    <!-- ភ្ជាប់ External CSS -->
    <link rel="stylesheet" href="./style/theme.css">

</head>

<body>

    <div class="container">

        <h1>JavaScript Theme</h1>

        <h3>Choose Your Theme</h3>

        <label>
            <input type="radio" name="rdoTheme" value="silver">
            Silver
        </label>

        <br><br>

        <label>
            <input type="radio" name="rdoTheme" value="orange">
            Orange
        </label>

        <br><br>

        <label>
            <input type="radio" name="rdoTheme" value="blue">
            Blue
        </label>

        <br><br>

        <button type="button" id="btnApply">
            Apply Theme
        </button>

        <hr>

        <h2>Welcome to My Website</h2>
        <p>JavaScript Basic Three Example</p>

    </div>

    <!-- ភ្ជាប់ External JavaScript -->
    <script src="./script/theme.js">
        
    </script>

</body>
</html>

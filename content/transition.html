
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors Transition</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .colors-transition {
            background-color: #333333;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;

            transition: background-color 0.4s ease-in-out,
                        color 0.4s ease-in-out;
        }

        #transitions:hover {
            background-color: yellow;
            color: black;
        }
    </style>
</head>

<body>

    <h2>CSS Colors Transition</h2>

    <input
        type="button"
        id="transitions"
        class="colors-transition"
        value="foreground and background colors transition">

</body>
</html>
